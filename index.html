    <title>교사 생존 배터리 &amp; 방학 D-Day</title>

    <link rel="alternate icon" type="image/png" sizes="192x192" href="./icon-192.png" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css"
    />

    <script>
      // Paint-time theme bootstrap: resolve the stored theme *before* the first
      // frame so the first paint already matches the teacher's choice.
      // Keys are listed newest-first; the current v4 key must stay at the top,
      // otherwise every migrated profile repaints in the wrong theme.
      ;(function () {
        try {
          var KEYS = [
            'school-survival-clock.settings.v4',
            'school-survival-clock.settings.v3',
            'school-survival-clock.settings.v2',
            'school-survival-clock.settings.v1',
            'teacher-survival-dashboard-settings',
          ]
          var raw = null
          for (var index = 0; index < KEYS.length; index += 1) {
            raw = localStorage.getItem(KEYS[index])
            if (raw) break
          }
          var mode = 'dark'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && typeof parsed.themeMode === 'string') {
              mode = parsed.themeMode
            } else if (parsed && parsed.theme === 'light') {
              mode = 'light'
            }
          }
          var resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode === 'light'
                ? 'light'
                : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', resolved)
          root.style.colorScheme = resolved
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', resolved === 'light' ? '#ffffff' : '#000000')
          }
        } catch (error) {
          // Blocked storage or an unexpected payload: the app defaults to dark.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
